<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>그림판</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #e9edf2; display: flex; flex-direction: column; height: 100vh; }
  #bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px; background: #f7f9fb; border-bottom: 1px solid #ccd; }
  #bar button { padding: 6px 10px; border: 1px solid #bbc; background: #fff; border-radius: 4px; cursor: pointer; }
  #bar button.on { background: #cfe3ff; border-color: #4a8af4; }
  .sw { width: 22px; height: 22px; border: 1px solid #888; cursor: pointer; padding: 0; }
  #wrap { flex: 1; overflow: auto; padding: 12px; }
  canvas { background: #fff; box-shadow: 0 1px 4px #0003; cursor: crosshair; touch-action: none; }
  #status { padding: 4px 8px; font-size: 12px; background: #f7f9fb; border-top: 1px solid #ccd; }
</style>
</head>
<body>
<div id="bar">
  <span id="tools"></span>
  <label>굵기 <input id="size" type="range" min="1" max="50" value="4"></label>
  <input id="color" type="color" value="#000000" title="색 선택">
  <span id="palette"></span>
  <button id="undo" title="Ctrl+Z">실행 취소</button>
  <button id="clear">새로 만들기</button>
  <button id="openBtn">열기</button><input id="file" type="file" accept="image/*" hidden>
  <button id="save">PNG 저장</button>
</div>
<div id="wrap"><canvas id="c" width="900" height="560"></canvas></div>
<div id="status">0, 0px</div>
<script>
const c = document.getElementById('c'), ctx = c.getContext('2d', { willReadFrequently: true });
const $ = id => document.getElementById(id);
const TOOLS = { pencil: '연필', brush: '브러시', eraser: '지우개', fill: '채우기', picker: '스포이드', line: '직선', rect: '사각형', ellipse: '타원', text: '텍스트' };
let tool = 'pencil', start = null, snapshot = null, undo = [];

for (const [k, name] of Object.entries(TOOLS)) {
  const b = document.createElement('button'); b.textContent = name; b.dataset.tool = k;
  b.onclick = () => { tool = k; document.querySelectorAll('[data-tool]').forEach(x => x.classList.toggle('on', x === b)); };
  $('tools').append(b);
}
$('tools').firstChild.classList.add('on');
for (const col of ['#000000','#7f7f7f','#ffffff','#c3c3c3','#ed1c24','#ff7f27','#fff200','#22b14c','#00a2e8','#3f48cc','#a349a4','#b97a57']) {
  const s = document.createElement('button'); s.className = 'sw'; s.style.background = col; s.onclick = () => $('color').value = col; $('palette').append(s);
}

function clearCanvas() { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); }
function pushUndo() { undo.push(ctx.getImageData(0, 0, c.width, c.height)); if (undo.length > 30) undo.shift(); }
function pos(e) { const r = c.getBoundingClientRect(); return { x: Math.round(e.clientX - r.left), y: Math.round(e.clientY - r.top) }; }
function hex2rgb(h) { return [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)); }

// Stack-based flood fill on raw pixels (exact color match).
function floodFill(img, x, y, [r, g, b]) {
  const { width: w, height: h, data: d } = img, i0 = (y * w + x) * 4;
  const t = [d[i0], d[i0 + 1], d[i0 + 2], d[i0 + 3]];
  if (t[0] === r && t[1] === g && t[2] === b && t[3] === 255) return;
  const same = i => d[i] === t[0] && d[i + 1] === t[1] && d[i + 2] === t[2] && d[i + 3] === t[3];
  const stack = [[x, y]];
  while (stack.length) {
    let [px, py] = stack.pop(), i = (py * w + px) * 4;
    while (px > 0 && same(i - 4)) { px--; i -= 4; }
    let up = false, down = false;
    for (; px < w && same(i); px++, i += 4) {
      d[i] = r; d[i + 1] = g; d[i + 2] = b; d[i + 3] = 255;
      if (py > 0) { const u = same(i - w * 4); if (u && !up) stack.push([px, py - 1]); up = u; }
      if (py < h - 1) { const v = same(i + w * 4); if (v && !down) stack.push([px, py + 1]); down = v; }
    }
  }
}

function stroke(from, to) {
  ctx.lineCap = ctx.lineJoin = 'round';
  ctx.lineWidth = tool === 'pencil' ? 1 : +$('size').value * (tool === 'eraser' ? 2 : 1);
  ctx.strokeStyle = tool === 'eraser' ? '#fff' : $('color').value;
  ctx.beginPath(); ctx.moveTo(from.x, from.y); ctx.lineTo(to.x, to.y); ctx.stroke();
}

function shape(a, b, e) {
  ctx.putImageData(snapshot, 0, 0);
  ctx.lineWidth = +$('size').value; ctx.strokeStyle = $('color').value; ctx.beginPath();
  let w = b.x - a.x, h = b.y - a.y;
  if (e.shiftKey && tool !== 'line') { const m = Math.max(Math.abs(w), Math.abs(h)); w = Math.sign(w) * m; h = Math.sign(h) * m; } // Shift = 정사각형/원
  if (tool === 'line') { ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); }
  else if (tool === 'rect') ctx.rect(a.x, a.y, w, h);
  else ctx.ellipse(a.x + w / 2, a.y + h / 2, Math.abs(w / 2), Math.abs(h / 2), 0, 0, Math.PI * 2);
  ctx.stroke();
}

c.onpointerdown = e => {
  const p = pos(e); pushUndo();
  if (tool === 'fill') { const img = ctx.getImageData(0, 0, c.width, c.height); floodFill(img, p.x, p.y, hex2rgb($('color').value)); ctx.putImageData(img, 0, 0); return; }
  if (tool === 'picker') { undo.pop(); const d = ctx.getImageData(p.x, p.y, 1, 1).data; $('color').value = '#' + [d[0], d[1], d[2]].map(v => v.toString(16).padStart(2, '0')).join(''); return; }
  if (tool === 'text') { const s = prompt('텍스트 입력'); if (!s) return undo.pop(); ctx.fillStyle = $('color').value; ctx.font = `${8 + +$('size').value * 2}px sans-serif`; ctx.fillText(s, p.x, p.y); return; }
  c.setPointerCapture(e.pointerId); start = p; snapshot = undo[undo.length - 1];
  if (['pencil', 'brush', 'eraser'].includes(tool)) stroke(p, p);
};
c.onpointermove = e => {
  const p = pos(e); $('status').textContent = `${p.x}, ${p.y}px`;
  if (!start) return;
  if (['pencil', 'brush', 'eraser'].includes(tool)) { stroke(start, p); start = p; } else shape(start, p, e);
};
c.onpointerup = () => start = null;

$('undo').onclick = () => undo.length && ctx.putImageData(undo.pop(), 0, 0);
document.onkeydown = e => { if (e.ctrlKey && e.key === 'z') { e.preventDefault(); $('undo').click(); } };
$('clear').onclick = () => { pushUndo(); clearCanvas(); };
$('save').onclick = () => { const a = document.createElement('a'); a.download = '그림.png'; a.href = c.toDataURL('image/png'); a.click(); };
$('openBtn').onclick = () => $('file').click();
$('file').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const img = new Image(); img.onload = () => { pushUndo(); c.width = img.width; c.height = img.height; ctx.drawImage(img, 0, 0); URL.revokeObjectURL(img.src); };
  img.src = URL.createObjectURL(f);
};

clearCanvas();

// Self-check: fill inside a closed box must not leak outside it.
(() => {
  const t = new ImageData(5, 5); t.data.fill(255);
  for (let i = 0; i < 5; i++) for (const [x, y] of [[i, 0], [i, 4], [0, i], [4, i]]) t.data.set([0, 0, 0, 255], (y * 5 + x) * 4);
  floodFill(t, 2, 2, [255, 0, 0]);
  console.assert(t.data[(2 * 5 + 2) * 4 + 1] === 0 && t.data[0] === 0 && t.data[(1 * 5 + 1) * 4] === 255, 'floodFill self-check failed');
})();
</script>
</body>
</html>
